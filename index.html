<!DOCTYPE html>¨
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vädertjänst</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="wrapper">

        <h1>Weather Service</h1>

        <button id="btn-my-location" class="btn btn-primary">My location!</button>

        <input id="search-input" class="form-control" aria-label="Sök efter en stad"
            placeholder="Sök efter en stad och tryck ENTER...">

        <section id="weather-result" class="card d-none">
            <img id="weather-icon" src="" alt="Bild på nuvarande väder">
            <h2 id="weather-name"></h2>
            <p id="weather-temp"></p>
            <p id="weather-wind"></p>
        </section>

        <h2>Latest request</h2>
        <ul id="history-list" class="list-group"></ul>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
